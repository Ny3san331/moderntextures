name: FixTextures
version: 1.0.0
main: dev.fixtextures.plugin.FixTexturesPlugin
api-version: '26.3'
description: Texturas da 26.3 por protocolo para Paper 26.3 (blocos, entidades, armadura, trims, partículas e itens segurados).
author: FixTextures
depend: [ViaVersion, ViaBackwards]
softdepend: [ViaRewind]
commands:
  fixtextures:
    aliases: [ft, mt]
    description: Estado, envio, recarga e variantes de textura.
    usage: /ft <status [jogador]|send [jogador]|reload|texture list|texture <nome>|texture <jogador> <nome>>
permissions:
  fixtextures.admin:
    default: op
  moderntextures.admin:
    default: false
