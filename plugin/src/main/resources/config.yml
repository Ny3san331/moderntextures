# Hospede os ZIPs gerados em um servidor HTTP(S) acessível pelos jogadores.
# Exemplo: https://cdn.seudominio.com/moderntextures/
base-url: ''
prompt: 'Texturas da versão 26.3 adaptadas para seu cliente.'
timeout-seconds: 120
detect-attempts: 20
detect-interval-ticks: 5
notify-player: true
# Opcional: serve os packs pelo próprio plugin, sem host HTTP externo.
# Requer uma porta TCP pública adicional (NÃO use a porta do Minecraft).
# Coloque os ZIPs em plugins/ModernTextures/packs/ ou o bundle em plugins/ModernTextures/packs.zip.
# public-url é o endereço que o jogador usa, por exemplo http://IP:8080/
embedded-server:
  enabled: false
  bind: '0.0.0.0'
  port: 8080
  public-url: ''
# O manifesto fica sempre na pasta deste plugin.
# A geração ocorre fora do servidor: java -jar ModernTextures-Generator.jar --help
